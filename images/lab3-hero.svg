<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
<title id="t">Hour 3 · Shift left</title>
<desc id="d">A Marketing request for real-time dashboards across all markets meets the warehouse: sell-through arrives on 105 Mondays, a weekly batch feed, and under-25 marketing is allowed in 0% of Indonesian and Italian consent rows but 73% in Japan. Three verdicts: buildable as asked, buildable with a change, not as asked. Below, the cost of a fix rises from 1x at Request to about 100x at Operate, and the check moves left to Request.</desc>
<defs>
  <linearGradient id="cost" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2EE6C5" stop-opacity=".0"/><stop offset=".55" stop-color="#FF7A3D" stop-opacity=".18"/><stop offset="1" stop-color="#FF4A00" stop-opacity=".42"/></linearGradient>
  <linearGradient id="costline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2EE6C5"/><stop offset=".5" stop-color="#FFB38A"/><stop offset="1" stop-color="#FF4A00"/></linearGradient>
  <radialGradient id="tglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00C9A7" stop-opacity=".55"/><stop offset="1" stop-color="#00C9A7" stop-opacity="0"/></radialGradient>
  <radialGradient id="oglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF4A00" stop-opacity=".4"/><stop offset="1" stop-color="#FF4A00" stop-opacity="0"/></radialGradient>
  <path id="ring" d="M646 72 m-47 0 a47 47 0 1 1 94 0 a47 47 0 1 1 -94 0"/>
</defs>
<style>
  text { white-space: pre; font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .sans { font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif; }
  .spin { animation: spin 36s linear infinite; transform-origin: 646px 72px; }
  .flow { stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
  .left { stroke-dasharray: 10 8; animation: left 1.2s linear infinite; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .bob2 { animation: bob 7s ease-in-out -2s infinite; }
  .bob3 { animation: bob 5s ease-in-out -1s infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .slide { animation: slide 4.8s cubic-bezier(.5,0,.2,1) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  @keyframes left { to { stroke-dashoffset: 18; } }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  @keyframes pulse { 50% { transform: scale(1.35); opacity: .35; } }
  @keyframes slide { 0%, 12% { transform: translateX(570px); opacity: 0; } 20% { opacity: .9; } 70%, 100% { transform: translateX(0); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .spin, .flow, .left, .bob, .bob2, .bob3, .pulse, .slide { animation: none; } .slide { opacity: 0; } }
</style>

<!-- ambient glows -->
<circle cx="540" cy="226" r="170" fill="url(#tglow)" opacity=".7"/>
<circle cx="640" cy="360" r="120" fill="url(#oglow)"/>

<!-- rotating stamp -->
<g class="spin">
  <circle cx="646" cy="72" r="58" fill="none" stroke="#2EE6C5" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 5"/>
  <text font-size="11" letter-spacing="3.6" fill="#7EF0DA"><textPath href="#ring">SHIFT LEFT · ASK FIRST · </textPath></text>
</g>
<circle cx="646" cy="72" r="30" fill="#00C9A7"/>
<path d="M660 72 H632 M643 61 L632 72 L643 83" fill="none" stroke="#061022" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- floating questions -->
<g class="bob3">
  <circle cx="330" cy="76" r="15" fill="#2EE6C5"/><text x="330" y="82" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#061022">?</text>
</g>
<g class="bob">
  <circle cx="294" cy="54" r="10" fill="#2EE6C5" fill-opacity=".55"/><text x="294" y="58.5" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#061022">?</text>
</g>

<!-- the request -->
<g class="bob">
  <rect x="16" y="96" width="340" height="176" rx="16" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".16"/>
  <circle cx="38" cy="120" r="4.5" fill="#FF4A00"/>
  <text x="50" y="124" font-size="10" fill="#93A7C6" letter-spacing="1.4">MARKETING REQUEST</text>
  <text x="34" y="154" class="sans" font-size="15.5" fill="#FFFFFF">“Real-time conversion dashboards</text>
  <text x="34" y="176" class="sans" font-size="15.5" fill="#FFFFFF">in Power BI, across all our markets…”</text>
  <g font-size="11">
    <rect x="34" y="196" width="84" height="26" rx="13" fill="#FF4A00" fill-opacity=".16" stroke="#FF7A3D"/><text x="76" y="213" text-anchor="middle" fill="#FFB38A">real-time</text>
    <rect x="126" y="196" width="92" height="26" rx="13" fill="#FF4A00" fill-opacity=".16" stroke="#FF7A3D"/><text x="172" y="213" text-anchor="middle" fill="#FFB38A">conversion</text>
    <rect x="226" y="196" width="104" height="26" rx="13" fill="#FF4A00" fill-opacity=".16" stroke="#FF7A3D"/><text x="278" y="213" text-anchor="middle" fill="#FFB38A">all markets</text>
    <rect x="34" y="230" width="84" height="26" rx="13" fill="#FF4A00" fill-opacity=".16" stroke="#FF7A3D"/><text x="76" y="247" text-anchor="middle" fill="#FFB38A">Power BI</text>
    <text x="130" y="247" font-size="10" fill="#93A7C6">four words · four assumptions</text>
  </g>
</g>

<!-- request meets warehouse -->
<path class="flow" d="M356 186 C372 186 368 226 386 226" fill="none" stroke="#2EE6C5" stroke-width="2"/>
<circle cx="356" cy="186" r="4" fill="#2EE6C5"/>

<!-- the warehouse facts -->
<g class="bob2">
  <rect x="386" y="150" width="318" height="152" rx="14" fill="#081428" fill-opacity=".94" stroke="#2EE6C5" stroke-opacity=".55"/>
  <text x="402" y="174" font-size="10" fill="#2EE6C5" letter-spacing="1.4">THE WAREHOUSE SAYS</text>
  <text x="690" y="174" text-anchor="end" font-size="10" fill="#6F86A8">SQLTools</text>
  <path d="M394 184 h302" stroke="#FFFFFF" stroke-opacity=".08"/>
  <text x="402" y="206" font-size="11.5" fill="#93A7C6">sell-through weeks</text>
  <text x="690" y="206" text-anchor="end" font-size="12.5" fill="#FFFFFF">105 Mondays</text>
  <text x="402" y="230" font-size="11.5" fill="#93A7C6">non-Monday rows</text>
  <text x="690" y="230" text-anchor="end" font-size="12.5" fill="#FFFFFF">0</text>
  <path d="M394 242 h302" stroke="#FFFFFF" stroke-opacity=".08"/>
  <text x="402" y="264" font-size="11.5" fill="#93A7C6">under-25 marketing allowed</text>
  <text x="690" y="288" text-anchor="end" font-size="13"><tspan fill="#FF8A7A">ID 0%</tspan><tspan fill="#6F86A8">  ·  </tspan><tspan fill="#FF8A7A">IT 0%</tspan><tspan fill="#6F86A8">  ·  </tspan><tspan fill="#7EF0DA">JP 73%</tspan></text>
</g>

<!-- the only three answers -->
<text x="34" y="296" font-size="9.5" fill="#93A7C6" letter-spacing="1.4">THE ONLY THREE VERDICTS</text>
<g font-size="11.5">
  <rect x="34" y="306" width="206" height="28" rx="14" fill="#12B865" fill-opacity=".18" stroke="#3BE08A" stroke-opacity=".75"/><text x="52" y="324" fill="#6FE3A3">✓  buildable as asked</text>
  <rect x="34" y="342" width="236" height="28" rx="14" fill="#F1B85B" fill-opacity=".14" stroke="#F1B85B" stroke-opacity=".75"/><text x="52" y="360" fill="#F6CC85">⟲  buildable with a change</text>
  <rect x="34" y="378" width="166" height="28" rx="14" fill="#FF5A47" fill-opacity=".14" stroke="#FF8A7A" stroke-opacity=".75"/><text x="52" y="396" fill="#FF9E90">✕  not as asked</text>
</g>

<!-- cost of change -->
<path d="M70 486 L70 476 C300 474 480 440 640 330 L640 486 Z" fill="url(#cost)"/>
<path d="M70 476 C300 474 480 440 640 330" fill="none" stroke="url(#costline)" stroke-width="3" stroke-linecap="round"/>
<text x="84" y="466" font-size="12" fill="#7EF0DA" font-weight="500">1×</text>
<text x="612" y="327" text-anchor="end" class="sans" font-size="22" font-weight="700" fill="#FF7A3D">≈100×</text>
<text x="612" y="343" text-anchor="end" font-size="9" fill="#93A7C6" letter-spacing="1">COST TO FIX</text>

<!-- the timeline -->
<path d="M40 486 H690" stroke="#93A7C6" stroke-opacity=".45" stroke-width="1.5"/>
<g font-size="10" fill="#93A7C6" letter-spacing="1.2" text-anchor="middle">
  <circle cx="70" cy="486" r="4" fill="#93A7C6"/><circle cx="212" cy="486" r="4" fill="#93A7C6"/><circle cx="354" cy="486" r="4" fill="#93A7C6"/><circle cx="496" cy="486" r="4" fill="#93A7C6"/><circle cx="640" cy="486" r="4" fill="#93A7C6"/>
  <text x="70" y="508" fill="#7EF0DA">REQUEST</text><text x="212" y="508">DESIGN</text><text x="354" y="508">BUILD</text><text x="496" y="508">TEST</text><text x="640" y="508">OPERATE</text>
</g>

<!-- where checking used to land: Operate (ghost) -->
<path d="M640 486 V430" stroke="#FF8A7A" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="640" y="430" width="50" height="20" rx="3" fill="none" stroke="#FF8A7A" stroke-dasharray="3 3"/>
<text x="665" y="444" text-anchor="middle" font-size="10" fill="#FF8A7A">fix</text>

<!-- where it lands now: Request -->
<circle class="pulse" cx="70" cy="486" r="12" fill="#2EE6C5" fill-opacity=".5"/>
<circle cx="70" cy="486" r="8" fill="#2EE6C5"/>
<path d="M70 486 V424" stroke="#2EE6C5" stroke-width="2.5"/>
<rect x="70" y="424" width="52" height="22" rx="3" fill="#2EE6C5"/>
<text x="96" y="439" text-anchor="middle" font-size="11" font-weight="500" fill="#061022">ASK</text>
<g class="slide"><circle cx="70" cy="486" r="6" fill="#2EE6C5"/></g>

<!-- shift left -->
<path class="left" d="M620 530 H92" fill="none" stroke="#2EE6C5" stroke-width="2.5" stroke-linecap="round"/>
<path d="M104 520 L88 530 L104 540" fill="none" stroke="#2EE6C5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="256" y="519" width="196" height="22" rx="11" fill="#071226"/>
<text x="354" y="534" text-anchor="middle" font-size="10.5" fill="#7EF0DA" letter-spacing="2">MOVE THE CHECK LEFT</text>
</svg>
