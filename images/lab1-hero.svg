<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
<title id="t">Hour 1 · No vibe pipelines</title>
<desc id="d">An AI-drafted SQL model runs clean, but its join to the consent ledger fans one event out into several rows: the magnifier shows 1,988 rows where 794 were expected. A padlock reads 7 of 7 tests pass once the fix is locked in.</desc>
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14305C" stop-opacity=".92"/><stop offset="1" stop-color="#0A1A36" stop-opacity=".94"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4A00"/><stop offset="1" stop-color="#FFB38A"/></linearGradient>
  <radialGradient id="lens" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#1B3A6B" stop-opacity=".95"/><stop offset="1" stop-color="#081428" stop-opacity=".98"/></radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF4A00" stop-opacity=".55"/><stop offset="1" stop-color="#FF4A00" stop-opacity="0"/></radialGradient>
  <radialGradient id="gglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3BE08A" stop-opacity=".5"/><stop offset="1" stop-color="#3BE08A" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <path id="ring" d="M640 80 m-47 0 a47 47 0 1 1 94 0 a47 47 0 1 1 -94 0"/>
  <clipPath id="lensclip"><circle cx="594" cy="318" r="84"/></clipPath>
</defs>
<style>
  text { white-space: pre; font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .sans { font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif; }
  .k { fill: #2EE6C5; } .s { fill: #FFB38A; } .p { fill: #DCE6F5; } .m { fill: #6F86A8; } .v { fill: #C3B9FF; }
  .spin { animation: spin 36s linear infinite; transform-origin: 640px 80px; }
  .flow { stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .bob2 { animation: bob 7s ease-in-out -2s infinite; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .tw2 { animation: tw 3.4s ease-in-out -1.2s infinite; transform-box: fill-box; transform-origin: center; }
  .cur { animation: cur 1.1s steps(2, start) infinite; }
  .row { animation: row 3.6s ease-in-out infinite; }
  .r2 { animation-delay: .25s; } .r3 { animation-delay: .5s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  @keyframes tw { 50% { transform: scale(.55); opacity: .4; } }
  @keyframes cur { 50% { opacity: 0; } }
  @keyframes row { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .spin, .flow, .bob, .bob2, .tw, .tw2, .cur, .row { animation: none; } }
</style>

<!-- ambient glows -->
<circle cx="594" cy="318" r="150" fill="url(#glow)"/>
<circle cx="560" cy="476" r="90" fill="url(#gglow)"/>

<!-- rotating stamp -->
<g class="spin">
  <circle cx="640" cy="80" r="58" fill="none" stroke="#FF7A3D" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 5"/>
  <text font-size="11" letter-spacing="3.1" fill="#FFB38A"><textPath href="#ring">NO VIBE PIPELINES · PROVE IT · </textPath></text>
</g>
<circle cx="640" cy="80" r="30" fill="#FF4A00"/>
<text x="640" y="92" text-anchor="middle" class="sans" font-size="34" font-weight="700" fill="#061022">≠</text>

<!-- sparkles: the assistant -->
<g fill="#FFB38A">
  <path class="tw" d="M34 108 l5 -15 l5 15 l15 5 l-15 5 l-5 15 l-5 -15 l-15 -5z"/>
  <path class="tw2" d="M76 82 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z" fill="#FF7A3D"/>
</g>

<!-- the draft: a code window -->
<g class="bob">
  <rect x="14" y="146" width="382" height="262" rx="16" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".14"/>
  <path d="M14 182 h382" stroke="#FFFFFF" stroke-opacity=".08"/>
  <circle cx="36" cy="164" r="5" fill="#FF5F57"/><circle cx="53" cy="164" r="5" fill="#FEBC2E"/><circle cx="70" cy="164" r="5" fill="#28C840"/>
  <text x="90" y="168" font-size="11.5" fill="#93A7C6">italy_conversion_events.sql</text>
  <rect x="300" y="155" width="84" height="19" rx="9.5" fill="#12B865" fill-opacity=".18" stroke="#3BE08A" stroke-opacity=".7"/>
  <text x="342" y="168" text-anchor="middle" font-size="10.5" fill="#6FE3A3">✓ run OK</text>

  <!-- ledger join highlight -->
  <rect x="22" y="309" width="366" height="22" rx="4" fill="#FF4A00" fill-opacity=".16"/>
  <rect x="22" y="309" width="3" height="22" fill="#FF4A00"/>

  <g font-size="12.5">
    <text x="32" y="210" class="m">1</text><text x="58" y="210"><tspan class="v">{{ config(materialized='view') }}</tspan></text>
    <text x="32" y="232" class="m">2</text><text x="58" y="232"><tspan class="k">select</tspan><tspan class="p"> e.event_id,</tspan></text>
    <text x="32" y="254" class="m">3</text><text x="58" y="254" class="p">       e.consumer_id,</text>
    <text x="32" y="276" class="m">4</text><text x="58" y="276" class="s">       c.marketing_allowed</text>
    <text x="32" y="298" class="m">5</text><text x="58" y="298"><tspan class="k">from</tspan><tspan class="p">   clr.lifecycle_events e</tspan></text>
    <text x="32" y="325" class="m">6</text><text x="58" y="325"><tspan class="k">join</tspan><tspan fill="#FF9A6B">   mpl.consent_records c</tspan></text>
    <text x="32" y="350" class="m">7</text><text x="58" y="350"><tspan class="k">  on</tspan><tspan class="p">   c.consumer_id = e.consumer_id</tspan></text>
    <text x="32" y="372" class="m">8</text><text x="58" y="372"><tspan class="k">where</tspan><tspan class="p">  e.market_code = </tspan><tspan class="s">'IT'</tspan></text>
    <rect class="cur" x="300" y="362" width="7" height="13" fill="#FF7A3D"/>
  </g>
  <!-- squiggle under the ledger -->
  <path d="M104 333 q4 4 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#FF4A00" stroke-width="1.6"/>
</g>

<!-- callout tag -->
<g class="bob2">
  <rect x="236" y="96" width="150" height="34" rx="9" fill="#FF4A00"/>
  <path d="M300 130 l10 10 l10 -10z" fill="#FF4A00"/>
  <text x="311" y="118" text-anchor="middle" font-size="12" fill="#061022" font-weight="500">a ledger · 2.5× rows</text>
</g>

<!-- fan-out: one event becomes many rows -->
<g fill="none" stroke-width="2" stroke-linecap="round">
  <path class="flow" d="M396 320 C420 320 414 250 432 250" stroke="#FF7A3D"/>
  <path class="flow" d="M396 320 L432 320" stroke="#FF7A3D"/>
  <path class="flow" d="M396 320 C420 320 414 390 432 390" stroke="#FF7A3D"/>
  <path class="flow" d="M502 250 C514 250 506 300 512 304" stroke="#FF7A3D" stroke-opacity=".6"/>
  <path class="flow" d="M502 320 L510 320" stroke="#FF7A3D" stroke-opacity=".6"/>
  <path class="flow" d="M502 390 C514 390 506 340 512 334" stroke="#FF7A3D" stroke-opacity=".6"/>
</g>
<circle cx="396" cy="320" r="6" fill="#FF4A00" stroke="#FFB38A" stroke-width="2"/>
<g font-size="10.5">
  <rect class="row" x="432" y="239" width="70" height="22" rx="6" fill="#FF4A00"/><text x="467" y="254" text-anchor="middle" fill="#061022">4711 · Jan</text>
  <rect class="row r2" x="432" y="309" width="70" height="22" rx="6" fill="#FF4A00"/><text x="467" y="324" text-anchor="middle" fill="#061022">4711 · Jun</text>
  <rect class="row r3" x="432" y="379" width="70" height="22" rx="6" fill="#FF4A00" fill-opacity=".7"/><text x="467" y="394" text-anchor="middle" fill="#061022">+1,194 …</text>
</g>

<!-- the lens -->
<circle cx="594" cy="318" r="96" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="18"/>
<circle cx="594" cy="318" r="84" fill="url(#lens)"/>
<g clip-path="url(#lensclip)">
  <text x="594" y="272" text-anchor="middle" font-size="9.5" fill="#93A7C6" letter-spacing="1.5">DRAFT ROWS</text>
  <text x="594" y="306" text-anchor="middle" class="sans" font-size="36" font-weight="700" fill="#FF8A7A">1,988</text>
  <path d="M548 294 L640 294" stroke="#FF8A7A" stroke-width="3" stroke-linecap="round"/>
  <path d="M540 322 h108" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="594" y="362" text-anchor="middle" class="sans" font-size="36" font-weight="700" fill="#3BE08A">794</text>
  <text x="594" y="382" text-anchor="middle" font-size="9.5" fill="#93A7C6" letter-spacing="1.5">SOURCE EVENTS</text>
</g>
<circle cx="594" cy="318" r="84" fill="none" stroke="#FFB38A" stroke-width="3"/>
<path d="M538 268 a72 72 0 0 1 52 -32" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
<path d="M655 380 l42 42" stroke="#FFB38A" stroke-width="16" stroke-linecap="round"/>
<path d="M655 380 l42 42" stroke="#FF4A00" stroke-width="7" stroke-linecap="round"/>

<!-- the lock: 7 tests pass -->
<g class="bob2">
  <rect x="418" y="448" width="224" height="64" rx="16" fill="#0B1D3A" stroke="#3BE08A" stroke-opacity=".6"/>
  <path d="M446 474 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#3BE08A" stroke-width="3.2"/>
  <rect x="440" y="472" width="36" height="28" rx="6" fill="#3BE08A"/>
  <circle cx="458" cy="484" r="3.6" fill="#0B1D3A"/><rect x="456.6" y="485" width="2.8" height="8" rx="1.2" fill="#0B1D3A"/>
  <text x="492" y="476" font-size="10.5" fill="#93A7C6" letter-spacing="1.2">DBT TEST</text>
  <text x="492" y="499" class="sans" font-size="20" font-weight="700" fill="#FFFFFF">7 / 7 <tspan fill="#3BE08A">PASS</tspan></text>
</g>

<!-- prompt bubble: the request -->
<g class="bob">
  <rect x="34" y="436" width="300" height="58" rx="14" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".16"/>
  <path d="M60 494 l-8 14 l20 -14z" fill="#FFFFFF" fill-opacity=".07"/>
  <text x="52" y="460" font-size="10" fill="#93A7C6" letter-spacing="1.4">TEAM REQUEST</text>
  <text x="52" y="481" class="sans" font-size="15" fill="#FFFFFF">“It runs clean. Ship it today?”</text>
</g>
</svg>
