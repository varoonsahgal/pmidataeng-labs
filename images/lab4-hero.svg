<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
<title id="t">Hour 4 · You are the gate</title>
<desc id="d">A friendly AI agent, the HORIZON analyst, sends two requests toward a gate marked YOU. The aggregating SELECT passes through to the horizon warehouse; the DELETE is stopped at the gate and never runs. Above, the answer card you checked in SQLTools: JP Partner Distributor 2, about 277 VEEV units per week. On the right, the readiness ladder with Experimentation highlighted as today's rung.</desc>
<defs>
  <radialGradient id="vglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7B66FF" stop-opacity=".55"/><stop offset="1" stop-color="#7B66FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="gglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3BE08A" stop-opacity=".35"/><stop offset="1" stop-color="#3BE08A" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14305C" stop-opacity=".94"/><stop offset="1" stop-color="#0A1A36" stop-opacity=".96"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A3F73"/><stop offset="1" stop-color="#172B55"/></linearGradient>
  <linearGradient id="db" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1D3A6E"/><stop offset=".5" stop-color="#2B4F8F"/><stop offset="1" stop-color="#16305E"/></linearGradient>
  <path id="ring" d="M88 92 m-47 0 a47 47 0 1 1 94 0 a47 47 0 1 1 -94 0"/>
</defs>
<style>
  text { white-space: pre; font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .sans { font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif; }
  .spin { animation: spin 36s linear infinite; transform-origin: 88px 92px; }
  .flow { stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
  .up { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .bob2 { animation: bob 7s ease-in-out -2s infinite; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .eye { animation: eye 5s infinite; transform-box: fill-box; transform-origin: center; }
  .ant { animation: ant 2.2s ease-in-out infinite; }
  .seal { animation: seal 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .here { animation: ant 2.4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  @keyframes tw { 50% { transform: scale(.55); opacity: .4; } }
  @keyframes eye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes ant { 50% { opacity: .45; } }
  @keyframes seal { 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .spin, .flow, .up, .bob, .bob2, .tw, .eye, .ant, .seal, .here { animation: none; } }
</style>

<!-- ambient glows -->
<circle cx="340" cy="300" r="170" fill="url(#vglow)"/>
<circle cx="560" cy="140" r="120" fill="url(#gglow)"/>

<!-- rotating stamp -->
<g class="spin">
  <circle cx="88" cy="92" r="58" fill="none" stroke="#A99BFF" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 5"/>
  <text font-size="11" letter-spacing="2.3" fill="#C3B9FF"><textPath href="#ring">YOU ARE THE GATE · NEW ≠ READY · </textPath></text>
</g>
<circle cx="88" cy="92" r="30" fill="#7B66FF"/>
<text x="88" y="104" text-anchor="middle" class="sans" font-size="34" font-weight="700" fill="#061022">≠</text>

<!-- the ask -->
<g class="bob2">
  <rect x="172" y="62" width="250" height="66" rx="14" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".16"/>
  <path d="M196 128 l-14 18 l30 -18z" fill="#FFFFFF" fill-opacity=".07"/>
  <text x="190" y="84" font-size="9.5" fill="#93A7C6" letter-spacing="1.4">ASK THE ANALYST</text>
  <text x="190" y="103" class="sans" font-size="13.5" fill="#FFFFFF">Which Japan distributor sells</text>
  <text x="190" y="120" class="sans" font-size="13.5" fill="#FFFFFF">the most VEEV units per week?</text>
</g>

<!-- ground -->
<path d="M24 420 H600" stroke="#A99BFF" stroke-opacity=".25"/>
<ellipse cx="105" cy="424" rx="54" ry="7" fill="#000" fill-opacity=".35"/>

<!-- the agent -->
<g class="bob">
  <path class="tw" d="M160 206 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4z" fill="#C3B9FF"/>
  <line x1="105" y1="240" x2="105" y2="220" stroke="#A99BFF" stroke-width="3"/>
  <circle class="ant" cx="105" cy="216" r="7" fill="#A99BFF"/>
  <rect x="55" y="240" width="100" height="78" rx="24" fill="#1B2F5C" stroke="#A99BFF" stroke-opacity=".7" stroke-width="2"/>
  <rect x="67" y="254" width="76" height="48" rx="14" fill="#081428"/>
  <rect class="eye" x="83" y="268" width="14" height="18" rx="7" fill="#A99BFF"/>
  <rect class="eye" x="113" y="268" width="14" height="18" rx="7" fill="#A99BFF"/>
  <path d="M96 293 q9 6 18 0" fill="none" stroke="#A99BFF" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="44" y="268" width="11" height="24" rx="5" fill="#2A3F73"/><rect x="155" y="268" width="11" height="24" rx="5" fill="#2A3F73"/>
  <rect x="72" y="324" width="66" height="50" rx="14" fill="#13305C" stroke="#FFFFFF" stroke-opacity=".12"/>
  <circle cx="105" cy="349" r="8" fill="#7B66FF"/><circle cx="105" cy="349" r="3.5" fill="#E6E1FF"/>
</g>
<text x="105" y="448" text-anchor="middle" font-size="10.5" fill="#C3B9FF" letter-spacing="1.2">HORIZON ANALYST</text>
<text x="105" y="464" text-anchor="middle" font-size="9.5" fill="#93A7C6">a Claude Desktop Project</text>

<!-- the gate -->
<rect x="262" y="236" width="26" height="184" rx="4" fill="url(#stone)" stroke="#FFFFFF" stroke-opacity=".12"/>
<rect x="392" y="236" width="26" height="184" rx="4" fill="url(#stone)" stroke="#FFFFFF" stroke-opacity=".12"/>
<path d="M262 246 A78 78 0 0 1 418 246" fill="none" stroke="#2A3F73" stroke-width="22"/>
<path d="M262 246 A78 78 0 0 1 418 246" fill="none" stroke="#A99BFF" stroke-opacity=".55" stroke-width="2"/>
<g class="seal">
  <circle cx="340" cy="282" r="38" fill="#7B66FF" stroke="#C3B9FF" stroke-width="2"/>
  <circle cx="340" cy="270" r="9" fill="#061022"/>
  <path d="M322 296 a18 15 0 0 1 36 0z" fill="#061022"/>
  <text x="340" y="312" text-anchor="middle" font-size="9" fill="#061022" font-weight="500" letter-spacing="1.5">YOU</text>
</g>

<!-- lane 1: the aggregate query goes through -->
<path class="flow" d="M140 352 H463" stroke="#3BE08A" stroke-width="2.2" fill="none"/>
<g>
  <rect x="172" y="341" width="78" height="22" rx="11" fill="#0B1D3A"/>
  <rect x="172" y="341" width="78" height="22" rx="11" fill="#12B865" fill-opacity=".22" stroke="#3BE08A"/>
  <text x="211" y="356" text-anchor="middle" font-size="10.5" fill="#6FE3A3">SELECT ✓</text>
</g>
<!-- lane 2: the DELETE stops at the gate -->
<path class="flow" d="M140 396 H290" stroke="#FF5A47" stroke-width="2.2" fill="none"/>
<g>
  <rect x="172" y="385" width="78" height="22" rx="11" fill="#0B1D3A"/>
  <rect x="172" y="385" width="78" height="22" rx="11" fill="#FF5A47" fill-opacity=".2" stroke="#FF8A7A"/>
  <text x="211" y="400" text-anchor="middle" font-size="10.5" fill="#FF8A7A">DELETE</text>
  <path d="M188 396 H234" stroke="#FF8A7A" stroke-width="1.6"/>
</g>
<circle cx="304" cy="396" r="14" fill="#FF5A47"/>
<path d="M298 390 l12 12 M310 390 l-12 12" stroke="#061022" stroke-width="3" stroke-linecap="round"/>
<text x="340" y="440" text-anchor="middle" font-size="10" fill="#FF8A7A" letter-spacing="1.4">NOT RUN</text>

<!-- the warehouse -->
<path d="M463 332 v76 a42 12 0 0 0 84 0 v-76" fill="url(#db)" stroke="#FFFFFF" stroke-opacity=".16"/>
<ellipse cx="505" cy="332" rx="42" ry="12" fill="#3A62A8" stroke="#FFFFFF" stroke-opacity=".2"/>
<path d="M463 360 a42 12 0 0 0 84 0 M463 384 a42 12 0 0 0 84 0" fill="none" stroke="#FFFFFF" stroke-opacity=".14"/>
<text x="505" y="378" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="500">horizon</text>
<text x="505" y="440" text-anchor="middle" font-size="9.5" fill="#93A7C6">Postgres</text>
<path class="up" d="M505 318 V206" stroke="#3BE08A" stroke-width="2" fill="none" stroke-opacity=".8"/>

<!-- the answer you checked -->
<g class="bob2">
  <rect x="446" y="70" width="252" height="128" rx="14" fill="url(#glass)" stroke="#3BE08A" stroke-opacity=".55"/>
  <text x="464" y="94" font-size="9.5" fill="#93A7C6" letter-spacing="1.4">SQLTOOLS · YOU RAN IT</text>
  <text x="464" y="118" class="sans" font-size="13" fill="#FFFFFF">JP Partner Distributor 2</text>
  <text x="462" y="174" class="sans" font-size="44" font-weight="700" fill="#FFFFFF">277</text>
  <text x="560" y="152" font-size="10.5" fill="#C3B9FF">VEEV units</text>
  <text x="560" y="168" font-size="10.5" fill="#C3B9FF">per week</text>
  <text x="560" y="186" font-size="10.5" fill="#6FE3A3">✓ matches</text>
</g>

<!-- the readiness ladder -->
<text x="656" y="216" text-anchor="middle" font-size="9" fill="#93A7C6" letter-spacing="1.6">READINESS</text>
<path d="M612 226 V420 M700 226 V420" stroke="#A99BFF" stroke-opacity=".45" stroke-width="3"/>
<g font-size="9" letter-spacing=".4">
  <rect x="600" y="230" width="112" height="24" rx="6" fill="#0B1D3A" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="656" y="246" text-anchor="middle" fill="#93A7C6">ADOPTION</text>
  <rect x="600" y="284" width="112" height="24" rx="6" fill="#0B1D3A" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="656" y="300" text-anchor="middle" fill="#93A7C6">PILOT</text>
  <rect class="here" x="596" y="336" width="120" height="28" rx="7" fill="#7B66FF" fill-opacity=".35"/>
  <rect x="600" y="338" width="112" height="24" rx="6" fill="#A99BFF"/>
  <text x="656" y="354" text-anchor="middle" fill="#061022" font-weight="500">EXPERIMENTATION</text>
  <rect x="600" y="392" width="112" height="24" rx="6" fill="#0B1D3A" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="656" y="408" text-anchor="middle" fill="#93A7C6">EXPLORATION</text>
</g>
<!-- a human gate before each rung -->
<g fill="#C3B9FF">
  <rect x="651" y="266" width="10" height="8" rx="1.5"/><path d="M653 266 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#C3B9FF" stroke-width="1.5"/>
  <rect x="651" y="320" width="10" height="8" rx="1.5"/><path d="M653 320 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#C3B9FF" stroke-width="1.5"/>
  <rect x="651" y="376" width="10" height="8" rx="1.5"/><path d="M653 376 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#C3B9FF" stroke-width="1.5"/>
</g>
<text x="592" y="354" text-anchor="end" font-size="9.5" fill="#C3B9FF">today ▸</text>

<!-- the only tool is you -->
<g class="bob">
  <rect x="232" y="476" width="330" height="58" rx="14" fill="#FFFFFF" fill-opacity=".06" stroke="#A99BFF" stroke-opacity=".4"/>
  <circle cx="258" cy="505" r="13" fill="#7B66FF"/>
  <path d="M252 505 l4 4 l8 -8" fill="none" stroke="#061022" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="282" y="500" class="sans" font-size="13" fill="#FFFFFF">The model never runs a query in this lab.</text>
  <text x="282" y="518" class="sans" font-size="13" fill="#C3B9FF">You do, in SQLTools.</text>
</g>
</svg>
