<text x="315.0" y="282" text-anchor="middle" class="b orange-ink" style="font-size:15px">human gate</text>
<rect x="350" y="302" width="220" height="130" rx="6" class="soft-navy"/>
<rect x="350" y="302" width="220" height="6" rx="3" class="f-navy"/>
<text x="460.0" y="336" text-anchor="middle" class="b" style="font-size:18px">Experimentation</text>
<text x="460.0" y="458" text-anchor="middle" class="muted" style="font-size:15px">sandbox, read-only</text>
<path d="M585.0,432 L585.0,242 Q585.0,224 605.0,224 Q625.0,224 625.0,242 L625.0,432" class="ln-orange" stroke-width="3"/>
<line x1="585.0" y1="266" x2="625.0" y2="266" class="ln-orange"/>
<circle cx="605.0" cy="284.1" r="8.1" class="f-orange"/>
<path d="M591.5,312.2 L591.5,303.2 A13.5,9.0 0 0 1 618.5,303.2 L618.5,312.2 Z" class="f-orange"/>
<text x="605.0" y="212" text-anchor="middle" class="b orange-ink" style="font-size:15px">human gate</text>
<rect x="640" y="232" width="220" height="200" rx="6" class="soft-navy"/>
<rect x="640" y="232" width="220" height="6" rx="3" class="f-navy"/>
<text x="750.0" y="266" text-anchor="middle" class="b" style="font-size:18px">Pilot</text>
<text x="750.0" y="458" text-anchor="middle" class="muted" style="font-size:15px">gated, real data, rollback</text>
<path d="M875.0,432 L875.0,172 Q875.0,154 895.0,154 Q915.0,154 915.0,172 L915.0,432" class="ln-orange" stroke-width="3"/>
<line x1="875.0" y1="196" x2="915.0" y2="196" class="ln-orange"/>
<circle cx="895.0" cy="214.1" r="8.1" class="f-orange"/>
<path d="M881.5,242.2 L881.5,233.2 A13.5,9.0 0 0 1 908.5,233.2 L908.5,242.2 Z" class="f-orange"/>
<text x="895.0" y="142" text-anchor="middle" class="b orange-ink" style="font-size:15px">human gate</text>
<rect x="930" y="162" width="220" height="270" rx="6" class="soft-navy"/>
<rect x="930" y="162" width="220" height="6" rx="3" class="f-navy"/>
<text x="1040.0" y="196" text-anchor="middle" class="b" style="font-size:18px">Adoption</text>
<text x="1040.0" y="458" text-anchor="middle" class="muted" style="font-size:15px">in the estate</text>
<line x1="60" y1="432" x2="1150" y2="432" class="ln-ink"/>
<rect x="382.0" y="244" width="156" height="32" rx="16" class="soft-orange"/>
<text x="460.0" y="266" text-anchor="middle" class="b orange-ink" style="font-size:15px">today's agent</text>
<line x1="460.0" y1="276" x2="460.0" y2="296" class="ln-orange" marker-end="url(#ladder-ar-orange)"/>
<text x="1160" y="100" text-anchor="end" class="muted" style="font-size:15px">more trust, more blast radius</text>
<line x1="938" y1="112" x2="1160" y2="112" class="ln" marker-end="url(#ladder-ar-muted)"/>
<text x="60" y="500" class="muted" style="font-size:15px">Hour 4: the HORIZON analyst is read-only, sandboxed and asks you to run every query. Defensible rung: Experimentation.</text>
</svg>
