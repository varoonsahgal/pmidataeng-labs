<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
<title id="t">Hour 2 · Green ≠ right</title>
<desc id="d">The nightly job dashboard shows a green SUCCESS with 0 alerts, night after night. Underneath, the Japan pipeline carries 1,050 source rows through a join with the condition channel_type &lt;&gt; 'ecommerce'; 105 rows from JP Ecommerce Distributor 3 fall out the side with no error, and only 945 arrive in the staged table.</desc>
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14305C" stop-opacity=".92"/><stop offset="1" stop-color="#0A1A36" stop-opacity=".94"/></linearGradient>
  <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1D3A"/><stop offset=".5" stop-color="#163A6E"/><stop offset="1" stop-color="#0B1D3A"/></linearGradient>
  <linearGradient id="src" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C9A7" stop-opacity=".55"/><stop offset=".5" stop-color="#2EE6C5" stop-opacity=".85"/><stop offset="1" stop-color="#00C9A7" stop-opacity=".55"/></linearGradient>
  <linearGradient id="stg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#12B865" stop-opacity=".55"/><stop offset=".5" stop-color="#3BE08A" stop-opacity=".85"/><stop offset="1" stop-color="#12B865" stop-opacity=".55"/></linearGradient>
  <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21497F"/><stop offset=".5" stop-color="#13305C"/><stop offset="1" stop-color="#0B1D3A"/></linearGradient>
  <radialGradient id="ggl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3BE08A" stop-opacity=".5"/><stop offset="1" stop-color="#3BE08A" stop-opacity="0"/></radialGradient>
  <radialGradient id="void" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000000" stop-opacity=".85"/><stop offset=".6" stop-color="#02060F" stop-opacity=".55"/><stop offset="1" stop-color="#02060F" stop-opacity="0"/></radialGradient>
  <radialGradient id="rgl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF5A47" stop-opacity=".45"/><stop offset="1" stop-color="#FF5A47" stop-opacity="0"/></radialGradient>
  <path id="ring" d="M640 80 m-47 0 a47 47 0 1 1 94 0 a47 47 0 1 1 -94 0"/>
</defs>
<style>
  text { white-space: pre; font-family: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .sans { font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif; }
  .spin { animation: spin 36s linear infinite; transform-origin: 640px 80px; }
  .flow { stroke-dasharray: 8 10; animation: flow 1.2s linear infinite; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .bob2 { animation: bob 7s ease-in-out -2s infinite; }
  .beat { animation: beat 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .fall { animation: fall 2.7s ease-in infinite; }
  .f2 { animation-delay: .9s; } .f3 { animation-delay: 1.8s; }
  .warn { animation: warn 1.6s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flow { to { stroke-dashoffset: -36; } }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  @keyframes beat { 50% { transform: scale(1.06); } }
  @keyframes fall { 0% { transform: translateY(-14px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(70px); opacity: 0; } }
  @keyframes warn { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .spin, .flow, .bob, .bob2, .beat, .fall, .warn { animation: none; } }
</style>

<!-- ambient -->
<circle cx="120" cy="140" r="170" fill="url(#ggl)"/>
<ellipse cx="356" cy="520" rx="150" ry="60" fill="url(#void)"/>
<circle cx="356" cy="440" r="90" fill="url(#rgl)"/>

<!-- rotating stamp -->
<g class="spin">
  <circle cx="640" cy="80" r="58" fill="none" stroke="#3BE08A" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 5"/>
  <text font-size="11" letter-spacing="3.6" fill="#8FF0BC"><textPath href="#ring">GREEN ≠ RIGHT · RECONCILE · </textPath></text>
</g>
<circle cx="640" cy="80" r="30" fill="#12B865"/>
<text x="640" y="92" text-anchor="middle" class="sans" font-size="34" font-weight="700" fill="#061022">≠</text>

<!-- the nightly job dashboard: green -->
<g class="bob">
  <rect x="18" y="34" width="336" height="206" rx="16" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".14"/>
  <path d="M18 70 h336" stroke="#FFFFFF" stroke-opacity=".08"/>
  <circle cx="40" cy="52" r="5" fill="#FF5F57"/><circle cx="57" cy="52" r="5" fill="#FEBC2E"/><circle cx="74" cy="52" r="5" fill="#28C840"/>
  <text x="94" y="56" font-size="11.5" fill="#93A7C6">nightly job · japan_sell_through</text>
  <g class="beat">
    <circle cx="82" cy="132" r="40" fill="#12B865" fill-opacity=".18"/>
    <circle cx="82" cy="132" r="30" fill="#3BE08A"/>
    <path d="M68 132 l10 10 l19 -20" fill="none" stroke="#061022" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="136" y="128" class="sans" font-size="31" font-weight="700" fill="#FFFFFF">SUCCESS</text>
  <text x="137" y="152" font-size="12" fill="#6FE3A3">0 errors · 0 alerts</text>
  <text x="38" y="196" font-size="9.5" fill="#93A7C6" letter-spacing="1.4">EVERY NIGHT, FOR WEEKS</text>
  <g fill="#3BE08A">
    <rect x="38" y="206" width="14" height="14" rx="3" fill-opacity=".35"/><rect x="58" y="206" width="14" height="14" rx="3" fill-opacity=".4"/><rect x="78" y="206" width="14" height="14" rx="3" fill-opacity=".45"/><rect x="98" y="206" width="14" height="14" rx="3" fill-opacity=".5"/><rect x="118" y="206" width="14" height="14" rx="3" fill-opacity=".55"/><rect x="138" y="206" width="14" height="14" rx="3" fill-opacity=".6"/><rect x="158" y="206" width="14" height="14" rx="3" fill-opacity=".65"/><rect x="178" y="206" width="14" height="14" rx="3" fill-opacity=".7"/><rect x="198" y="206" width="14" height="14" rx="3" fill-opacity=".75"/><rect x="218" y="206" width="14" height="14" rx="3" fill-opacity=".8"/><rect x="238" y="206" width="14" height="14" rx="3" fill-opacity=".85"/><rect x="258" y="206" width="14" height="14" rx="3" fill-opacity=".9"/><rect x="278" y="206" width="14" height="14" rx="3" fill-opacity=".95"/><rect x="298" y="206" width="14" height="14" rx="3"/>
  </g>
  <rect x="318" y="206" width="14" height="14" rx="3" fill="none" stroke="#3BE08A" stroke-dasharray="2 2"/>
</g>

<!-- the question -->
<g class="bob2">
  <rect x="382" y="168" width="232" height="58" rx="14" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".16"/>
  <path d="M410 226 l-8 14 l20 -14z" fill="#FFFFFF" fill-opacity=".07"/>
  <text x="400" y="192" font-size="10" fill="#93A7C6" letter-spacing="1.4">MARKETING QUERY</text>
  <text x="400" y="213" class="sans" font-size="15" fill="#FFFFFF">“Green for weeks. Fine?”</text>
</g>

<!-- source tank: 1,050 -->
<path d="M30 300 v160 a60 14 0 0 0 120 0 v-160" fill="url(#tank)" stroke="#FFFFFF" stroke-opacity=".18"/>
<path d="M30 316 v144 a60 14 0 0 0 120 0 v-144 a60 14 0 0 1 -120 0z" fill="url(#src)"/>
<ellipse cx="90" cy="316" rx="60" ry="14" fill="#2EE6C5" fill-opacity=".55"/>
<ellipse cx="90" cy="300" rx="60" ry="14" fill="none" stroke="#FFFFFF" stroke-opacity=".25"/>
<text x="90" y="398" text-anchor="middle" class="sans" font-size="30" font-weight="700" fill="#FFFFFF">1,050</text>
<text x="90" y="420" text-anchor="middle" font-size="10" fill="#E8FFF9" letter-spacing="1.4">SOURCE · JP</text>
<text x="90" y="282" text-anchor="middle" font-size="10" fill="#93A7C6" letter-spacing="1">rst.sell_through</text>

<!-- staged tank: 945 -->
<path d="M570 300 v160 a60 14 0 0 0 120 0 v-160" fill="url(#tank)" stroke="#FFFFFF" stroke-opacity=".18"/>
<path d="M570 331 v129 a60 14 0 0 0 120 0 v-129 a60 14 0 0 1 -120 0z" fill="url(#stg)"/>
<ellipse cx="630" cy="331" rx="60" ry="14" fill="#3BE08A" fill-opacity=".55"/>
<ellipse cx="630" cy="300" rx="60" ry="14" fill="none" stroke="#FFFFFF" stroke-opacity=".25"/>
<ellipse cx="630" cy="316" rx="60" ry="14" fill="none" stroke="#FF5A47" stroke-width="1.6" stroke-dasharray="4 4" class="warn"/>
<text x="630" y="398" text-anchor="middle" class="sans" font-size="30" font-weight="700" fill="#FFFFFF">945</text>
<text x="630" y="420" text-anchor="middle" font-size="10" fill="#E8FFF9" letter-spacing="1.4">STAGED · JP</text>
<text x="630" y="282" text-anchor="middle" font-size="10" fill="#93A7C6" letter-spacing="1">analytics.japan_…</text>

<!-- the pipe -->
<rect x="146" y="366" width="428" height="28" rx="14" fill="url(#pipe)" stroke="#FFFFFF" stroke-opacity=".16"/>
<path class="flow" d="M160 380 H560" stroke="#2EE6C5" stroke-width="3" stroke-linecap="round" fill="none" stroke-opacity=".8"/>

<!-- the filter in the join -->
<rect x="334" y="352" width="44" height="56" rx="10" fill="#0B1D3A" stroke="#FF5A47" stroke-width="2"/>
<path d="M344 364 h24 l-8 12 v12 l-8 6 v-18z" fill="#FF5A47"/>
<path d="M356 408 v12" stroke="#FF5A47" stroke-width="3" stroke-linecap="round"/>
<g class="bob2">
  <rect x="232" y="302" width="248" height="30" rx="8" fill="#1A1220" stroke="#FF8A7A" stroke-opacity=".8"/>
  <path d="M348 332 l8 10 l8 -10z" fill="#FF8A7A"/>
  <text x="356" y="322" text-anchor="middle" font-size="11.5" fill="#FF8A7A">and d.channel_type &lt;&gt; 'ecommerce'</text>
</g>

<!-- the leak: 105 rows fall out the side, silently -->
<g font-size="10">
  <g class="fall"><rect x="326" y="428" width="60" height="18" rx="5" fill="#FF5A47"/><text x="356" y="441" text-anchor="middle" fill="#160606">dist 3</text></g>
  <g class="fall f2"><rect x="326" y="428" width="60" height="18" rx="5" fill="#FF5A47" fill-opacity=".85"/><text x="356" y="441" text-anchor="middle" fill="#160606">dist 3</text></g>
  <g class="fall f3"><rect x="326" y="428" width="60" height="18" rx="5" fill="#FF5A47" fill-opacity=".7"/><text x="356" y="441" text-anchor="middle" fill="#160606">dist 3</text></g>
</g>
<text x="398" y="446" class="sans" font-size="24" font-weight="700" fill="#FF8A7A">105 rows</text>
<text x="398" y="465" class="sans" font-size="13.5" fill="#FF8A7A">fall out the side, silently</text>
<text x="398" y="484" font-size="10.5" fill="#B9C8DF">JP Ecommerce Distributor 3</text>
<text x="398" y="500" font-size="10.5" fill="#93A7C6">no error · no alert</text>
</svg>
