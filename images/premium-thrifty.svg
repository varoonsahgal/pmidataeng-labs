<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" class="hz" role="img" aria-labelledby="prem-title prem-desc">
<title id="prem-title">Premium planning, thrifty execution: Draft on Sonnet, prove in the warehouse, plan the fix on Opus, implement and test on Sonnet</title>
<desc id="prem-desc">Four boxes with model badges: Step 1 Draft (Sonnet, thrifty), Step 2 Prove (the warehouse: three checks, 1,988 vs 794), Step 3 Plan the fix (Opus, premium, a short plan you review), Steps 3 + 4 Build + lock (Sonnet), ending in 794 = 794 with 4 tests passing. A price strip: Opus 5.5 $4 in / $20 out, Sonnet 5.5 $2 / $10, Haiku 5.5 $0.10 / $0.50 per million tokens; output costs 5 times input.</desc>
<style>
.hz{
  --navy:#102B53; --navy2:#0C2040; --orange:#FF4A00; --teal:#00C9A7; --ink:#1C2B40;
  --tint:#F4F6FA; --muted:#5A6B80; --red:#C8402A;
  --card:#FFFFFF; --line:#C9D3E0; --grid:#E4E9F1; --code:#F4F6FA;
  --claude:#102B53; --on-claude:#FFFFFF;
  --teal-ink:#00805F; --teal-soft:#D6F5EE;
  --orange-ink:#D63D00; --orange-soft:#FFE6DA;
  --red-ink:#B5361F; --red-soft:#FAE3DE;
  --navy-soft:#E4EAF4; --mutedfill:#C3CDDA;
}
@media (prefers-color-scheme: dark){
  .hz{
    --ink:#F4F6FA; --muted:#AFBDD0; --card:#13305F; --line:#3C5884; --grid:#25416C; --code:#0B1B36;
    --claude:#2F5FB4; --on-claude:#FFFFFF;
    --teal-ink:#1FD9B9; --teal-soft:#0F3F3A;
    --orange-ink:#FF8A5B; --orange-soft:#4B2514;
    --red:#E8604A; --red-ink:#FF8B78; --red-soft:#4E1D17;
    --navy-soft:#1B3B6E; --mutedfill:#4E6686; --tint:#0C2040;
  }
}
.hz text{font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink);font-size:16px}
.hz .mono{font-family:"DM Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.hz .b{font-weight:700}
.hz .i{font-style:italic}
.hz .muted{fill:var(--muted)}
.hz .teal-ink{fill:var(--teal-ink)}
.hz .orange-ink{fill:var(--orange-ink)}
.hz .red-ink{fill:var(--red-ink)}
.hz .on{fill:var(--on-claude)}
.hz .card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.hz .soft-navy{fill:var(--navy-soft);stroke:var(--line);stroke-width:1.5}
.hz .soft-teal{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
.hz .soft-orange{fill:var(--orange-soft);stroke:var(--orange);stroke-width:1.5}
.hz .soft-red{fill:var(--red-soft);stroke:var(--red);stroke-width:1.5}
.hz .claude{fill:var(--claude);stroke:none}
.hz .code{fill:var(--code);stroke:var(--line);stroke-width:1}
.hz .ln{stroke:var(--muted);stroke-width:2;fill:none}
.hz .ln-ink{stroke:var(--ink);stroke-width:2;fill:none}
.hz .ln-teal{stroke:var(--teal);stroke-width:2.5;fill:none}
.hz .ln-orange{stroke:var(--orange);stroke-width:2.5;fill:none}
.hz .ln-red{stroke:var(--red);stroke-width:2.5;fill:none}
.hz .ln-claude{stroke:var(--claude);stroke-width:2;fill:none}
.hz .dash{stroke-dasharray:7 6}
.hz .grid{stroke:var(--grid);stroke-width:1;fill:none}
.hz .f-teal{fill:var(--teal)}
.hz .f-orange{fill:var(--orange)}
.hz .f-red{fill:var(--red)}
.hz .f-muted{fill:var(--mutedfill)}
.hz .f-card{fill:var(--card)}
.hz .f-line{fill:var(--line)}
.hz .f-ink{fill:var(--ink)}
.hz .f-navy{fill:var(--claude)}
.hz .f-code{fill:var(--code)}
.hz .f-teal-soft{fill:var(--teal-soft)}
.hz .f-orange-soft{fill:var(--orange-soft)}
.hz .f-red-soft{fill:var(--red-soft)}
.hz .f-navy-soft{fill:var(--navy-soft)}
.hz .mk-muted{fill:var(--muted)}
.hz .mk-ink{fill:var(--ink)}
.hz .mk-teal{fill:var(--teal)}
.hz .mk-orange{fill:var(--orange)}
.hz .mk-red{fill:var(--red)}
.hz .mk-claude{fill:var(--claude)}
</style>
<defs>
<marker id="prem-ar-muted" viewBox="0 0 14 14" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" class="mk-muted"/></marker>
<marker id="prem-ar-ink" viewBox="0 0 14 14" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" class="mk-ink"/></marker>
<marker id="prem-ar-teal" viewBox="0 0 14 14" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" class="mk-teal"/></marker>
<marker id="prem-ar-orange" viewBox="0 0 14 14" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" class="mk-orange"/></marker>
<marker id="prem-ar-red" viewBox="0 0 14 14" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" class="mk-red"/></marker>
<marker id="prem-ar-claude" viewBox="0 0 14 14" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" class="mk-claude"/></marker>
</defs>
<rect x="40" y="60" width="206" height="196" rx="12" class="card"/>
<text x="58" y="88" class="mono b orange-ink" style="font-size:14px" letter-spacing="1.5">STEP 1</text>
<text x="58" y="116" class="b" style="font-size:19px">Draft</text>
<rect x="58" y="130" width="170" height="30" rx="15" class="card" stroke="#102B53" stroke-width="1.5"/>
<text x="143.0" y="150" text-anchor="middle" class="b" style="font-size:15px">Sonnet 5.5 · thrifty</text>
<text x="58" y="188" style="font-size:15px">a first SQL draft</text>
<text x="58" y="210" class="muted" style="font-size:15px">fast and cheap</text>
<text x="58" y="232" class="muted" style="font-size:15px">probably wrong</text>
<line x1="246" y1="158.0" x2="288" y2="158.0" class="ln" marker-end="url(#prem-ar-muted)"/>
<rect x="292" y="60" width="206" height="196" rx="12" class="card"/>
<text x="310" y="88" class="mono b orange-ink" style="font-size:14px" letter-spacing="1.5">STEP 2</text>
<text x="310" y="116" class="b" style="font-size:19px">Prove</text>
<rect x="310" y="130" width="170" height="30" rx="15" class="soft-teal"/>
<text x="395.0" y="150" text-anchor="middle" class="b teal-ink" style="font-size:15px">the warehouse</text>
<text x="310" y="188" style="font-size:15px">three checks</text>
<text x="310" y="210" class="muted" style="font-size:15px">794? 3552? NULLs?</text>
<text x="310" y="232" class="muted" style="font-size:15px">the numbers are the bug</text>
<line x1="498" y1="158.0" x2="540" y2="158.0" class="ln" marker-end="url(#prem-ar-muted)"/>
<rect x="544" y="60" width="206" height="196" rx="12" class="card"/>
<text x="562" y="88" class="mono b orange-ink" style="font-size:14px" letter-spacing="1.5">STEP 3</text>
<text x="562" y="116" class="b" style="font-size:19px">Plan the fix</text>
<rect x="562" y="130" width="170" height="30" rx="15" class="claude"/>
<text x="647.0" y="150" text-anchor="middle" class="b on" style="font-size:15px">Opus 5.5 · premium</text>
<text x="562" y="188" style="font-size:15px">a 15-line plan</text>
<text x="562" y="210" class="muted" style="font-size:15px">you read and approve</text>
<text x="562" y="232" class="muted" style="font-size:15px">no code yet</text>
<line x1="750" y1="158.0" x2="792" y2="158.0" class="ln" marker-end="url(#prem-ar-muted)"/>
<rect x="796" y="60" width="206" height="196" rx="12" class="card"/>
<text x="814" y="88" class="mono b orange-ink" style="font-size:14px" letter-spacing="1.5">STEP 3 + 4</text>
<text x="814" y="116" class="b" style="font-size:19px">Build + lock</text>
<rect x="814" y="130" width="170" height="30" rx="15" class="card" stroke="#102B53" stroke-width="1.5"/>
<text x="899.0" y="150" text-anchor="middle" class="b" style="font-size:15px">Sonnet 5.5 · thrifty</text>
<text x="814" y="188" style="font-size:15px">model + schema.yml</text>
<text x="814" y="210" class="muted" style="font-size:15px">+ singular test</text>
<text x="814" y="232" class="muted" style="font-size:15px">dbt run · dbt test</text>
<line x1="1002" y1="158.0" x2="1042" y2="158.0" class="ln-teal" marker-end="url(#prem-ar-teal)"/>
<rect x="1046" y="100" width="112" height="116" rx="12" class="soft-teal"/>
<text x="1102" y="146" text-anchor="middle" class="b teal-ink" style="font-size:21px">794 = 794</text>
<text x="1102" y="170" text-anchor="middle" class="b" style="font-size:15px">4 tests pass</text>
<text x="1102" y="190" text-anchor="middle" class="muted" style="font-size:13px">Hour 1,</text>
<text x="1102" y="206" text-anchor="middle" class="muted" style="font-size:13px">Steps 1 to 4</text>
<text x="40" y="286" class="muted" style="font-size:15px">Why switch models? A plan is a few hundred tokens read by a careful reader; the implementation is thousands of tokens of SQL and YAML.</text>
<text x="40" y="306" class="muted" style="font-size:15px">Spend the expensive model where judgement matters and the cheap one where volume does.</text>
<text x="40" y="326" class="muted" style="font-size:15px">In Claude Desktop the model picker is next to the send button; switch at any point and it applies from the next reply.</text>
<text x="40" y="346" class="muted" style="font-size:15px">No Opus in your picker? Stay on Sonnet: the plan-then-implement split still teaches the point.</text>
<rect x="40" y="366" width="1120" height="126" rx="12" class="code"/>
<text x="60" y="394" class="b" style="font-size:15px">Anthropic list prices, October 2026 · per million tokens, input / output</text>
<rect x="60" y="410" width="130" height="30" rx="15" class="claude"/>
<text x="125.0" y="430" text-anchor="middle" class="b on" style="font-size:15px">Opus 5.5</text>
<text x="204" y="431" class="mono b" style="font-size:17px">$4 / $20</text>
<rect x="360" y="410" width="130" height="30" rx="15" class="card" stroke="#102B53" stroke-width="1.5"/>
<text x="425.0" y="430" text-anchor="middle" class="b" style="font-size:15px">Sonnet 5.5</text>
<text x="504" y="431" class="mono b" style="font-size:17px">$2 / $10</text>
<rect x="660" y="410" width="130" height="30" rx="15" class="card"/>
<text x="725.0" y="430" text-anchor="middle" class="b muted" style="font-size:15px">Haiku 5.5</text>
<text x="804" y="431" class="mono b" style="font-size:17px">$0.10 / $0.50</text>
<text x="1140" y="431" text-anchor="end" class="b orange-ink" style="font-size:17px">output costs 5× input</text>
<text x="60" y="472" class="muted" style="font-size:15px">Opus is 2× Sonnet per token, Sonnet 20× Haiku. On a subscription the same ratio shows up as how fast you use your session limit.</text>
</svg>
